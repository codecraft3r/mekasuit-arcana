name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag (e.g. v0.1.0-1.21.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015eac00f08242b7538776 # v5.1.1
        with:
          python-version: '3.11'

      - name: Resolve tag and version
        id: resolve
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Strip leading 'v' to obtain the SemVer mod version
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building MekaSuit Arcana version ${VERSION} (tag: ${TAG})"

      - name: Extract changelog notes
        id: changelog
        run: |
          python3 tools/extract-changelog.py "${{ steps.resolve.outputs.tag }}" > RELEASE_NOTES.md
          echo "=== Release Notes ==="
          cat RELEASE_NOTES.md

      - name: Build release jar and runtime test harness
        run: ./gradlew --no-daemon -Pversion="${{ steps.resolve.outputs.version }}" build runtimeTestJar --console=plain

      - name: Verify release packaging
        run: python3 tools/verify-release.py "${{ steps.resolve.outputs.version }}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          gh release create "${TAG}" \
            "build/libs/mekasuit-arcana-${VERSION}.jar#mekasuit-arcana-${VERSION}.jar" \
            --title "MekaSuit Arcana ${TAG}" \
            --notes-file RELEASE_NOTES.md
